name: Release CLI

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: darwin-arm64
            runner: macos-14
            build_script: build:macos:arm64
          - arch: darwin-x64
            runner: macos-13
            build_script: build:macos:x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build binary
        run: bun run --cwd apps/cli ${{ matrix.build_script }}

      - name: Package artifact
        run: chmod +x apps/cli/dist/puhutko-lite && tar -czf puhutko-lite-${{ matrix.arch }}.tar.gz -C apps/cli/dist puhutko-lite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: puhutko-lite-${{ matrix.arch }}
          path: puhutko-lite-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      sha_arm64: ${{ steps.sha.outputs.sha_arm64 }}
      sha_x64: ${{ steps.sha.outputs.sha_x64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: puhutko-lite-darwin-arm64

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: puhutko-lite-darwin-x64

      - name: Collect release metadata
        id: release_meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        id: sha
        run: |
          SHA_ARM64="$(sha256sum puhutko-lite-darwin-arm64.tar.gz | cut -d' ' -f1)"
          SHA_X64="$(sha256sum puhutko-lite-darwin-x64.tar.gz | cut -d' ' -f1)"
          echo "sha_arm64=${SHA_ARM64}" >> "$GITHUB_OUTPUT"
          echo "sha_x64=${SHA_X64}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            puhutko-lite-darwin-arm64.tar.gz
            puhutko-lite-darwin-x64.tar.gz

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: publish-release
    if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.publish-release.outputs.version }}
      SHA_ARM64: ${{ needs.publish-release.outputs.sha_arm64 }}
      SHA_X64: ${{ needs.publish-release.outputs.sha_x64 }}
      OWNER: ${{ github.repository_owner }}
      TAP_REPO: homebrew-puhutko-lite
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OWNER }}/${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write formula
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/puhutko-lite.rb <<EOF
          class PuhutkoLite < Formula
            desc "Interactive Finnish dictionary app"
            homepage "https://github.com/${OWNER}/puhutko-lite"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${OWNER}/puhutko-lite/releases/download/v${VERSION}/puhutko-lite-darwin-arm64.tar.gz"
                sha256 "${SHA_ARM64}"
              else
                url "https://github.com/${OWNER}/puhutko-lite/releases/download/v${VERSION}/puhutko-lite-darwin-x64.tar.gz"
                sha256 "${SHA_X64}"
              end
            end

            def install
              bin.install "puhutko-lite"
            end

            test do
              output = shell_output("#{bin}/puhutko-lite --version")
              assert_match "puhutko-lite #{version}", output
            end
          end
          EOF

      - name: Commit and push formula update
        run: |
          cd tap
          git add Formula/puhutko-lite.rb
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update puhutko-lite to v${VERSION}"
          git push
