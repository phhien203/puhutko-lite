name: Release CLI

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: darwin-arm64
            runner: macos-14
            build_script: build:macos:arm64
            binary_path: apps/cli/dist/puhutko-lite
            artifact_file: puhutko-lite-darwin-arm64.tar.gz
          - arch: windows-x64
            runner: windows-latest
            build_script: build:windows:x64
            binary_path: apps/cli/dist/puhutko-lite.exe
            artifact_file: puhutko-lite-windows-x64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build binary
        run: bun run --cwd apps/cli ${{ matrix.build_script }}

      - name: Collect release metadata
        id: release_meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Smoke test binary
        shell: bash
        run: |
          OUTPUT="$(${{ matrix.binary_path }} --version)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "${{ steps.release_meta.outputs.version }}"

      - name: Install Inno Setup
        if: ${{ matrix.arch == 'windows-x64' }}
        shell: pwsh
        run: choco install innosetup --yes

      - name: Build Windows installer
        if: ${{ matrix.arch == 'windows-x64' }}
        shell: pwsh
        run: >-
          iscc "/DAppVersion=${{ steps.release_meta.outputs.version }}" "apps/cli/installer/windows/puhutko-lite.iss"

      - name: Package artifact (macOS)
        if: ${{ startsWith(matrix.arch, 'darwin-') }}
        shell: bash
        run: |
          chmod +x apps/cli/dist/puhutko-lite
          tar -czf ${{ matrix.artifact_file }} -C apps/cli/dist puhutko-lite

      - name: Package artifact (Windows)
        if: ${{ matrix.arch == 'windows-x64' }}
        shell: pwsh
        run: >-
          Compress-Archive -Path "apps/cli/installer/windows/Output/PuhutkoLite-Setup.exe" -DestinationPath "${{ matrix.artifact_file }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: puhutko-lite-${{ matrix.arch }}
          path: ${{ matrix.artifact_file }}
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      sha_arm64: ${{ steps.sha.outputs.sha_arm64 }}
      sha_windows_x64: ${{ steps.sha.outputs.sha_windows_x64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download arm64 artifact
        uses: actions/download-artifact@v5
        with:
          name: puhutko-lite-darwin-arm64

      - name: Download windows artifact
        uses: actions/download-artifact@v5
        with:
          name: puhutko-lite-windows-x64

      - name: Collect release metadata
        id: release_meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        id: sha
        run: |
          SHA_ARM64="$(sha256sum puhutko-lite-darwin-arm64.tar.gz | cut -d' ' -f1)"
          SHA_WINDOWS_X64="$(sha256sum puhutko-lite-windows-x64.zip | cut -d' ' -f1)"
          echo "sha_arm64=${SHA_ARM64}" >> "$GITHUB_OUTPUT"
          echo "sha_windows_x64=${SHA_WINDOWS_X64}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            puhutko-lite-darwin-arm64.tar.gz
            puhutko-lite-windows-x64.zip

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.publish-release.outputs.version }}
      SHA_ARM64: ${{ needs.publish-release.outputs.sha_arm64 }}
      OWNER: ${{ github.repository_owner }}
      TAP_REPO: homebrew-puhutko-lite
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Ensure HOMEBREW_TAP_TOKEN is configured
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' }}
        run: |
          echo "Missing HOMEBREW_TAP_TOKEN secret."
          echo "Add it in: Settings > Secrets and variables > Actions."
          exit 1

      - name: Checkout tap repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.OWNER }}/${{ env.TAP_REPO }}
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write formula
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/puhutko-lite.rb <<EOF
          class PuhutkoLite < Formula
            desc "Interactive Finnish dictionary app"
            homepage "https://github.com/${OWNER}/puhutko-lite"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${OWNER}/puhutko-lite/releases/download/v${VERSION}/puhutko-lite-darwin-arm64.tar.gz"
                sha256 "${SHA_ARM64}"
              end
            end

            def install
              bin.install "puhutko-lite"
            end

            test do
              output = shell_output("#{bin}/puhutko-lite --version")
              assert_match "puhutko-lite #{version}", output
            end
          end
          EOF

      - name: Commit and push formula update
        run: |
          cd tap
          git add Formula/puhutko-lite.rb
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update puhutko-lite to v${VERSION}"
          git push
